name: CI2 Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

env:
  APP_NAME: my-node-appola
  APP_VERSION: latest

jobs:

  # -------------------------
  # Cache + Install
  # -------------------------
  create_cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Yarn Classic
        run: npm install -g yarn@1

      - name: Install dependencies
        run: yarn install --ignore-engines

  # -------------------------
  # Yarn Tests
  # -------------------------
  yarn_test:
    runs-on: ubuntu-latest
    needs: create_cache
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        run: yarn test

  # -------------------------
  # Semgrep
  # -------------------------
  semgrep:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep --config=auto

      - name: Run Semgrep scan
        run: |
          mkdir -p semgrep
          semgrep scan \
            --config p/ci \
            --sarif \
            --output semgrep/semgrep-report.json || true